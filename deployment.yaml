apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-demo
  template:
    metadata:
      labels:
        app: portfolio-demo
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USERNAME/portfolio-demo:1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-demo
spec:
  selector:
    app: portfolio-demo
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
